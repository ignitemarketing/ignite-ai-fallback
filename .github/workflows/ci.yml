name: CI

# Build and test on every pull request to main and every push to main.
# The job is named `validate`: the `main-protection` ruleset requires a status
# check with exactly that name.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: validate
    runs-on: ${{ vars.CI_PAID_RUNNER == 'blacksmith' && 'blacksmith-2vcpu-ubuntu-2404' || 'ubicloud-standard-2' }}
    timeout-minutes: 10
    steps:
      # Setup steps stay fail-fast.
      - name: Check out
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          check-latest: true

      - name: Install dependencies
        id: install
        run: npm ci

      # Verification steps each run even if an earlier one failed.
      - name: Build
        id: build
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run build

      - name: Test
        id: test
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm test

      - name: Summary
        if: ${{ !cancelled() }}
        env:
          INSTALL: ${{ steps.install.outcome }}
          BUILD: ${{ steps.build.outcome }}
          TEST: ${{ steps.test.outcome }}
        run: |
          {
            echo "| step | result |"
            echo "| --- | --- |"
            echo "| install | $INSTALL |"
            echo "| build | $BUILD |"
            echo "| test | $TEST |"
          } >> "$GITHUB_STEP_SUMMARY"
          failed=""
          [ "$INSTALL" = "success" ] || failed="$failed install"
          [ "$BUILD" = "success" ] || failed="$failed build"
          [ "$TEST" = "success" ] || failed="$failed test"
          if [ -n "$failed" ]; then
            echo "::error::failed or skipped:$failed"
            exit 1
          fi

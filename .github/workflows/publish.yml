name: Publish to JSR

# Publishes to JSR whenever a v* tag is pushed (e.g. v0.2.0).
# Requires a one-time link of the JSR package to this GitHub repo:
#   jsr.io/@ignitemarketing/ai-fallback → Settings → GitHub repository → ignitemarketing/ignite-ai-fallback
# (JSR's settings page still shows the pre-transfer name colingreig/ignite-ai-fallback; OIDC
# publishing kept working after the 2026-08 transfer, e.g. v0.8.0 on 2026-08-24.)
# After that, JSR trusts this workflow via OIDC — no token needed.

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ${{ vars.CI_PAID_RUNNER == 'blacksmith' && 'blacksmith-2vcpu-ubuntu-2404' || 'ubicloud-standard-2' }}
    permissions:
      contents: read
      id-token: write # required for JSR OIDC authentication
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          check-latest: true
      - name: Verify version matches tag
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./jsr.json').version")
          if [ "$TAG" != "$PKG" ]; then
            echo "Tag $GITHUB_REF_NAME does not match jsr.json version $PKG" >&2
            exit 1
          fi
      # package-lock.json is committed and pins the TypeScript build tool.
      # `npm ci` installs exactly that and never rewrites it, so the tree stays
      # clean and jsr's uncommitted-changes guard needs no override.
      - name: Install dependencies
        run: npm ci
      - name: Build & test
        run: npm run test:all
      - name: Publish to JSR
        run: npx jsr publish
